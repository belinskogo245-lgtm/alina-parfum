name: Обновление каталога
on:
  schedule:
    - cron: '17 * * * *'   # каждый час
  workflow_dispatch:
  push:
    paths: ['scripts/**', '.github/workflows/catalog.yml']
permissions:
  contents: write
concurrency: { group: catalog, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-catalog.mjs
      - name: Сохранить, если изменился
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || (git commit -m "Каталог: автообновление" && git push)
